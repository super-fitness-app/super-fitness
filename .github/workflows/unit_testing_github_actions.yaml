
name: Flutter CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  unit-widget-test:
    name: Analyze and test Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy .env
        run: touch .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Test summary
        if: always()
        run: |
          echo "## Flutter Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the workflow steps above for detailed results." >> "$GITHUB_STEP_SUMMARY"
